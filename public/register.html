<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Project — FRT Manager</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #162447;
      color: white;
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 32px; }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; white-space: nowrap; }

    nav { display: flex; gap: 4px; }
    nav a {
      color: rgba(255,255,255,.65);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      transition: all .15s;
    }
    nav a:hover { color: white; background: rgba(255,255,255,.1); }
    nav a.active { color: white; background: rgba(255,255,255,.18); }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .user-info img { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); }
    .user-info span { font-size: 13px; color: rgba(255,255,255,.85); }
    .btn-signout {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      padding: 5px 13px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-signout:hover { background: rgba(255,255,255,.22); }

    main { max-width: 560px; margin: 48px auto; padding: 0 24px 48px; }

    .page-header { margin-bottom: 24px; }
    .page-header h2 { font-size: 20px; font-weight: 700; color: #162447; }
    .page-header p { font-size: 13px; color: #6b7280; margin-top: 4px; line-height: 1.5; }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      padding: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .hint { font-size: 12px; color: #9ca3af; font-weight: 400; margin-left: 4px; }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .project-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      min-width: 0;
    }
    .project-input:focus { border-color: #139be8; }

    .btn-lookup {
      background: #162447;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, opacity .15s;
    }
    .btn-lookup:hover { background: #1e3a6e; }
    .btn-lookup:disabled { opacity: .5; cursor: not-allowed; }

    .result-card {
      margin-top: 14px;
      padding: 12px 16px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      border-radius: 8px;
      display: none;
      align-items: center;
      gap: 12px;
    }
    .result-card.visible { display: flex; }
    .result-icon { font-size: 18px; flex-shrink: 0; }
    .result-label { font-size: 11px; font-weight: 600; color: #15803d; text-transform: uppercase; letter-spacing: .5px; }
    .result-name { font-size: 14px; font-weight: 600; color: #166534; margin-top: 1px; }

    .error-card {
      margin-top: 14px;
      padding: 11px 14px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-size: 13px;
      color: #991b1b;
      display: none;
    }
    .error-card.visible { display: block; }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f3f4f6;
    }

    .btn-primary {
      background: #139be8;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary:not(:disabled):hover { background: #0e87d0; }

    .btn-secondary {
      background: none;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all .15s;
    }
    .btn-secondary:hover { border-color: #d1d5db; color: #374151; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
      transform: translateY(80px);
      opacity: 0;
      transition: transform .25s, opacity .25s;
      z-index: 200;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { background: #065f46; }
    #toast.error { background: #991b1b; }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>FRT Manager</h1>
    <nav>
      <a href="/">Connected Projects</a>
      <a href="/register" class="active">Register Project</a>
    </nav>
  </div>
  <div class="header-right">
    <div class="user-info">
      <img id="user-photo" src="" alt="" style="display:none">
      <span id="user-name"></span>
    </div>
    <form action="/auth/logout" method="POST">
      <button type="submit" class="btn-signout">Sign out</button>
    </form>
  </div>
</header>

<main>
  <div class="page-header">
    <h2>Register New Project</h2>
    <p>Paste the Asana project URL or GID to connect it for First Response Time tracking.</p>
  </div>

  <div class="card">
    <label for="project-input">
      Project URL or GID
      <span class="hint">— from your browser's address bar</span>
    </label>
    <div class="input-row">
      <input
        type="text"
        id="project-input"
        class="project-input"
        placeholder="https://app.asana.com/… or 1234567890"
        autocomplete="off"
        onkeydown="if(event.key==='Enter') lookupProject()"
      >
      <button id="lookup-btn" class="btn-lookup" onclick="lookupProject()">Look up</button>
    </div>

    <div class="result-card" id="result-card">
      <div class="result-icon">✓</div>
      <div>
        <div class="result-label">Project found</div>
        <div class="result-name" id="result-name"></div>
      </div>
    </div>

    <div class="error-card" id="error-card"></div>

    <div class="form-actions">
      <button id="register-btn" class="btn-primary" disabled onclick="registerWebhook()">
        Register Webhook
      </button>
      <a href="/" class="btn-secondary">Cancel</a>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
  let selectedGid = null
  let selectedName = null

  async function init () {
    try {
      const me = await apiFetch('/ui/me')
      if (me.name) document.getElementById('user-name').textContent = me.name
      if (me.photo) {
        const img = document.getElementById('user-photo')
        img.src = me.photo
        img.style.display = 'block'
      }
    } catch {}
  }

  function extractGid (input) {
    // Extract from full Asana URL: .../project/GID/...
    const urlMatch = input.match(/\/project\/(\d+)/)
    if (urlMatch) return urlMatch[1]
    // Raw GID (digits only)
    if (/^\d+$/.test(input.trim())) return input.trim()
    return null
  }

  async function lookupProject () {
    const raw = document.getElementById('project-input').value.trim()
    if (!raw) return

    const gid = extractGid(raw)
    if (!gid) {
      showError('Could not find a project GID. Paste the full Asana project URL or just the numeric GID.')
      return
    }

    const btn = document.getElementById('lookup-btn')
    btn.disabled = true
    btn.textContent = 'Looking up…'
    hideResult()
    hideError()
    selectedGid = null
    selectedName = null
    document.getElementById('register-btn').disabled = true

    try {
      const { gid: projectGid, name } = await apiFetch(`/ui/projects/${gid}`)
      selectedGid = projectGid
      selectedName = name
      document.getElementById('result-name').textContent = name
      document.getElementById('result-card').classList.add('visible')
      document.getElementById('register-btn').disabled = false
    } catch (err) {
      showError(err.message || 'Project not found. Check the URL or GID and try again.')
    } finally {
      btn.disabled = false
      btn.textContent = 'Look up'
    }
  }

  async function registerWebhook () {
    if (!selectedGid) return
    const btn = document.getElementById('register-btn')
    btn.disabled = true
    btn.textContent = 'Registering…'
    try {
      await apiFetch('/ui/webhooks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gid: selectedGid })
      })
      showToast(`Webhook registered for "${selectedName}"`, 'success')
      setTimeout(() => { window.location.href = '/' }, 1200)
    } catch (err) {
      showToast(err.message || 'Failed to register — please try again', 'error')
      btn.disabled = false
      btn.textContent = 'Register Webhook'
    }
  }

  function hideResult () {
    document.getElementById('result-card').classList.remove('visible')
  }

  function hideError () {
    const el = document.getElementById('error-card')
    el.textContent = ''
    el.classList.remove('visible')
  }

  function showError (msg) {
    const el = document.getElementById('error-card')
    el.textContent = msg
    el.classList.add('visible')
  }

  async function apiFetch (url, opts = {}) {
    const res = await fetch(url, opts)
    if (res.status === 401) {
      // Session expired — go to login instead of rendering a dead page
      window.location.href = '/login'
      throw new Error('Session expired')
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.message || `Error ${res.status}`)
    }
    return res.status === 204 ? null : res.json()
  }

  let toastTimer
  function showToast (msg, type = 'success') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = `show ${type}`
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.className = '' }, 3500)
  }

  init()
</script>
</body>
</html>
